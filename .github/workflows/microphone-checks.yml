name: Microphone checks

on:
  push:
    branches: [feature/shared-microphone]
    paths:
      - 'mac/**'
      - 'shared/**'
      - 'windows/**'
      - 'windows-helper/**'
      - '.github/workflows/microphone-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Microphone and paired-direction regressions
        shell: bash
        run: |
          node shared/test/microphone.js
          node shared/test/microphone-renderer.js
          node shared/test/pairsync.js
          node shared/test/i18n.js
          node shared/test/sidebar-model.js
          node --check shared/ui-microphone.js
          node --check shared/microphone-runtime.js
          node --check shared/feature-art.js
      - name: Compile Windows native helpers
        if: runner.os == 'Windows'
        shell: cmd
        run: call windows-helper\build.cmd
      - name: Physical F8 edge regression
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:windows-helper\bin\microphone-key-test.exe windows-helper\src\MicrophoneKey.cs windows-helper\test\MicrophoneKeyTest.cs
          if errorlevel 1 exit /b 1
          windows-helper\bin\microphone-key-test.exe
